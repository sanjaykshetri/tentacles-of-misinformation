project:
  type: book
  output-dir: _book

book:
  title: "The Tentacles of Misinformation"
  subtitle: "Behavioral Science, NLP, and Predictive Analytics for Misinformation Susceptibility"
  author: "Sanjay Kumar Chhetri"
  date: today
  chapters:
    - index.qmd
    - chapters/00-prologue.qmd
    - chapters/01-measuring-vulnerability.qmd
    - chapters/02-detecting-narratives.qmd
    - chapters/03-modeling-spread.qmd
    - chapters/04-fusion-scale.qmd
    - chapters/05-election-case-study.qmd
    - chapters/06-epilogue.qmd

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-fold: true
    code-summary: "Show code"
    highlight-style: github
    include-in-header:
      - text: |
          <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
            document.addEventListener('DOMContentLoaded', function() {
              mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
              mermaid.run({ querySelector: '.mermaid' });
            });
          </script>

execute:
  freeze: auto
